name: FocusGate APK Build

on:
  push:
    branches: [focusgate-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct source archive
        run: cat fgchunk-* | base64 -d > FocusGate-source.zip

      - name: Extract project
        run: unzip -q FocusGate-source.zip

      - name: Build debug APK
        run: gradle -p FocusGate --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusGate-debug-apk
          path: FocusGate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
