name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned application, Worker and browser runtimes
        run: npm install --no-save --no-package-lock --no-audit --no-fund wrangler@4.123.0 playwright@1.62.0 better-auth@1.6.29

      - name: Run unit, contract and modularity boundary tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/test-logs
          npm test 2>&1 | tee .artifacts/test-logs/unit.log

      - name: Run real Worker and isolated D1 integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/test-logs
          npm run test:integration 2>&1 | tee .artifacts/test-logs/integration.log
          npm run test:auth-integration 2>&1 | tee -a .artifacts/test-logs/integration.log

      - name: Install pinned browser binaries
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Run local Worker browser acceptance gate
        env:
          GC_E2E_SCREENSHOT_DIR: .artifacts/ui
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/test-logs
          bash scripts/run-browser-e2e.sh 2>&1 | tee .artifacts/test-logs/browser.log
          bash scripts/run-auth-browser-e2e.sh 2>&1 | tee -a .artifacts/test-logs/browser.log

      - name: Upload Product Rebuild validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-rebuild-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/ui
            .artifacts/test-logs
          if-no-files-found: ignore
          retention-days: 7

  deploy-preview2:
    name: Deploy exact tested Preview 2 head
    needs: test
    if: >-
      github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout exact tested Preview 2 commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned Preview 2 deployment runtime
        run: npm add --no-save --no-package-lock --no-audit --no-fund wrangler@4.123.0 better-auth@1.6.29

      - name: Verify tested Preview 2 deployment contract and credentials
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'm-nejatmand2026/Personal-Growth-Tracker'
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }

      - name: Resolve isolated Preview 2 D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 list --json > .preview2-d1-list.json
          db_id="$(node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('.preview2-d1-list.json','utf8'));const list=Array.isArray(raw)?raw:(raw.result||raw.databases||[]);const m=list.filter(x=>x&&x.name==='personal-growth-tracker-preview2');if(m.length!==1)throw new Error('Expected exactly one Preview 2 D1 database, found '+m.length);const id=m[0].uuid||m[0].id||m[0].database_id||'';if(!id)throw new Error('Preview 2 D1 has no identifier.');process.stdout.write(id);")"
          test -n "$db_id"
          printf '%s' "$db_id" > .preview2-db-id

      - name: Build isolated Preview 2 Wrangler config and enforce D1 separation
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));const prod=c.d1_databases?.find(x=>x.binding==='DB');const p1=c.env?.preview?.d1_databases?.find(x=>x.binding==='DB');const id=fs.readFileSync('.preview2-db-id','utf8').trim();if(c.name!=='personal-growth-tracker')throw new Error('Unexpected Worker base name: '+c.name);if(!prod?.database_id||!p1?.database_id)throw new Error('Production and Preview 1 D1 identities must remain explicit.');if(!id)throw new Error('Preview 2 D1 id is empty.');if(id===prod.database_id)throw new Error('Preview 2 points at Production D1. Refusing deployment.');if(id===p1.database_id)throw new Error('Preview 2 points at Preview 1 D1. Refusing deployment.');c.env||={};c.env.preview2={name:'personal-growth-tracker-preview2',observability:{enabled:true,head_sampling_rate:1},d1_databases:[{binding:'DB',database_name:'personal-growth-tracker-preview2',database_id:id,migrations_dir:'migrations'}]};fs.writeFileSync('.wrangler.preview2.json',JSON.stringify(c,null,2));"

      - name: Capture current Preview 2 rollback identity and D1 bookmark
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_KEY: preview2-ambient-luxury-2026-08-22
        run: |
          set -euo pipefail
          mkdir -p .artifacts/preview2-backup
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const backupKey = process.env.BACKUP_KEY;
          const worker = 'personal-growth-tracker-preview2';
          const database = 'personal-growth-tracker-preview2';
          const dbId = fs.readFileSync('.preview2-db-id','utf8').trim();
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}`;
          async function cf(path) {
            const response = await fetch(api + path, { headers: { Authorization: `Bearer ${token}` } });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) throw new Error(`Cloudflare API ${response.status} for ${path}`);
            return body.result;
          }
          (async () => {
            const deploymentResult = await cf(`/workers/scripts/${worker}/deployments`);
            const deployments = Array.isArray(deploymentResult?.deployments) ? deploymentResult.deployments : (Array.isArray(deploymentResult) ? deploymentResult : []);
            const latest = [...deployments].sort((a,b)=>String(b?.created_on||'').localeCompare(String(a?.created_on||'')))[0];
            if (!latest) throw new Error('No active Preview 2 Worker deployment found; refusing replacement without rollback identity.');
            const bookmarkResult = await cf(`/d1/database/${dbId}/time_travel/bookmark`);
            const bookmark = bookmarkResult?.bookmark || '';
            if (!bookmark) throw new Error('No Preview 2 D1 Time Travel bookmark returned; refusing replacement without data restore point.');
            const versionIds = Array.isArray(latest.versions) ? latest.versions.map(v=>v?.version_id||v?.id).filter(Boolean) : [];
            const snapshot = {
              backup_key: backupKey,
              display_name: 'Preview 2 — Ambient Luxury Snapshot (2026-08-22)',
              captured_at_utc: new Date().toISOString(),
              worker_name: worker,
              worker_deployment_id: latest.id || null,
              worker_created_on: latest.created_on || null,
              worker_message: latest.annotations?.['workers/message'] || null,
              worker_version_ids: versionIds,
              d1_name: database,
              d1_id: dbId,
              d1_time_travel_bookmark: bookmark,
              restore_notes: 'Worker: rollback to one of worker_version_ids using Cloudflare Workers rollback. D1: restore the isolated Preview 2 database to d1_time_travel_bookmark only if database rollback is also required. A full SQL export is stored beside this file.'
            };
            fs.writeFileSync('.artifacts/preview2-backup/restore-manifest.json', JSON.stringify(snapshot,null,2));
            fs.writeFileSync('.artifacts/preview2-backup/RESTORE.txt', [
              snapshot.display_name,
              `Backup key: ${backupKey}`,
              `Captured UTC: ${snapshot.captured_at_utc}`,
              `Worker: ${worker}`,
              `Deployment ID: ${snapshot.worker_deployment_id || 'n/a'}`,
              `Worker message: ${snapshot.worker_message || 'n/a'}`,
              `Worker version IDs: ${versionIds.join(', ') || 'n/a'}`,
              `D1: ${database}`,
              `D1 bookmark: ${bookmark}`,
              '',
              'Restore Worker code/config first using the recorded Cloudflare Worker version.',
              'Restore D1 only if the data itself must also return to this exact snapshot; D1 restore overwrites the current Preview 2 database.',
              'Never target Preview 1 or Production with these restore values.'
            ].join('\n'));
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Export complete isolated Preview 2 D1 backup
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 export DB --remote --env preview2 --config .wrangler.preview2.json --output=.artifacts/preview2-backup/d1-full.sql --skip-confirmation
          test -s .artifacts/preview2-backup/d1-full.sql || { echo 'Preview 2 D1 export is empty; refusing deployment.'; exit 1; }

      - name: Upload recoverable pre-redesign Preview 2 backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview2-ambient-luxury-2026-08-22-${{ github.run_id }}
          path: .artifacts/preview2-backup
          if-no-files-found: error
          retention-days: 90

      - name: Apply only the explicitly authorized Preview 2 migration set
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GC_PREVIEW2_MIGRATION_CONFIRM: personal-growth-tracker-preview2
        run: |
          set -euo pipefail
          authorized_count='9'
          actual_count="$(find migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d '[:space:]')"
          test "$actual_count" = "$authorized_count" || {
            echo "Preview 2 migration set changed: expected $authorized_count SQL files, found $actual_count. Refusing migration."
            exit 1
          }
          verify_blob() {
            file="$1"
            expected="$2"
            actual="$(git rev-parse "HEAD:migrations/$file")"
            test "$actual" = "$expected" || {
              echo "Unauthorized Preview 2 migration content for $file. Refusing migration."
              exit 1
            }
          }
          verify_blob '0001_init.sql' 'dc9c757af309667e1bf70f66614b5166ac27dce7'
          verify_blob '0002_version_one_core_model.sql' '04753e438bd6bc19868ea700a99961b3696441c3'
          verify_blob '0003_capacity_schedule_flexibility.sql' 'd4f8d9c1250d85ac0865e321fc8a7ed3226ac489'
          verify_blob '0004_daily_plan.sql' 'feca2348e3a4780695db8b01cfef9fe104ae355c'
          verify_blob '0005_journal.sql' '0d1e2c0e4988bb313d154d6db06827db203c56a5'
          verify_blob '0006_activities_contract.sql' '5b6d5b038738fd055ff3b7456e8c2f69dd20c89b'
          verify_blob '0007_wellbeing_energy.sql' '3c3a3c25a28ff6c23b00c2d4828d55e9c0217201'
          verify_blob '0008_auth_multi_user.sql' 'c902d52f0a5d33bda61df5cc59f50d11c0627792'
          verify_blob '0009_time_aware_capacity.sql' '9c5866c1868c788430a7954ce8b15c4a558d99c0'
          bash scripts/migrate-preview2.sh

      - name: Verify no pending Preview 2 migrations before deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.123.0 d1 migrations list DB --remote --env preview2 --config .wrangler.preview2.json 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'No migrations to apply' >/dev/null || {
            echo 'Preview 2 still has pending D1 migrations after the authorized migration operation. Refusing Worker deployment.'
            exit 1
          }

      - name: Preview 2 deployment dry run
        run: npx --yes wrangler@4.123.0 deploy --dry-run --env preview2 --config .wrangler.preview2.json --name personal-growth-tracker-preview2

      - name: Deploy exact tested Preview 2 Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes wrangler@4.123.0 deploy --env preview2 --config .wrangler.preview2.json --name personal-growth-tracker-preview2 --message "git:$TESTED_SHA"

      - name: Verify exact Preview 2 deployment and isolated D1 directly
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const testedSha = process.env.TESTED_SHA;
          const worker = 'personal-growth-tracker-preview2';
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function cf(path, options = {}) {
            const response = await fetch(api + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) throw new Error(`Cloudflare API ${response.status} for ${path}.`);
            return body.result;
          }

          const deploymentResult = await cf(`/workers/scripts/${worker}/deployments`);
          const deployments = Array.isArray(deploymentResult?.deployments) ? deploymentResult.deployments : (Array.isArray(deploymentResult) ? deploymentResult : []);
          const latest = [...deployments].sort((a, b) => String(b?.created_on || '').localeCompare(String(a?.created_on || '')))[0];
          const message = latest?.annotations?.['workers/message'] || '';
          if (message !== `git:${testedSha}`) throw new Error(`Preview 2 deployment message mismatch: ${JSON.stringify(message)}.`);

          const databases = await cf('/d1/database?per_page=1000');
          const list = Array.isArray(databases) ? databases : [];
          const exact = (name) => list.filter((database) => database?.name === name);
          const preview2 = exact('personal-growth-tracker-preview2');
          const preview1 = exact('personal-growth-tracker-preview');
          const production = exact('personal-growth-tracker');
          if (preview2.length !== 1 || preview1.length !== 1 || production.length !== 1) throw new Error('Preview resource identities are ambiguous.');
          if (preview2[0].uuid === preview1[0].uuid || preview2[0].uuid === production[0].uuid) throw new Error('Preview 2 D1 overlaps Preview 1 or Production.');

          const query = await cf(`/d1/database/${preview2[0].uuid}/query`, {
            method: 'POST',
            body: JSON.stringify({ sql: "PRAGMA quick_check; SELECT 'ok' AS status;" })
          });
          const serialized = JSON.stringify(query);
          if (!serialized.includes('"quick_check":"ok"') || !serialized.includes('"status":"ok"')) throw new Error('Preview 2 D1 direct health verification failed.');

          console.log(`Exact tested Preview 2 deployment verified: git:${testedSha}`);
          NODE
