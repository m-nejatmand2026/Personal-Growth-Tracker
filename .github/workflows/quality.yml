name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run unit, contract and modularity boundary tests
        run: npm test

      - name: Install pinned Worker and browser test runtimes
        run: npm install --no-save --no-package-lock --no-audit --no-fund wrangler@4.123.0 playwright@1.62.0

      - name: Run real Worker and isolated D1 integration tests
        run: npm run test:integration

      - name: Install pinned browser binaries
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Run local Worker browser acceptance gate
        env:
          GC_E2E_SCREENSHOT_DIR: .artifacts/ui
        run: bash scripts/run-browser-e2e.sh

      - name: Upload Revision C visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: revision-c-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/ui
          if-no-files-found: ignore
          retention-days: 7