name: Preview 2 Cloudflare Probe
# Permission recheck after Cloudflare D1 Write was enabled on the shared Preview token.

on:
  push:
    branches: [feature/experience-v2]

permissions:
  contents: read

concurrency:
  group: growth-compass-preview2-cloudflare-probe
  cancel-in-progress: true

jobs:
  preview2-cloudflare-probe:
    name: Resolve isolated Preview 2 D1
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Preview 2 commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Preview 2 Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/experience-v2'
          test "$GITHUB_REPOSITORY" = 'm-nejatmand2026/Personal-Growth-Tracker'
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.'; exit 1; }

      - name: Find or create isolated Preview 2 D1 only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          target='personal-growth-tracker-preview2'
          npx --yes wrangler@4.123.0 d1 list --json > .preview2-d1-list.json
          db_id="$(node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('.preview2-d1-list.json','utf8'));const list=Array.isArray(raw)?raw:(raw.result||raw.databases||[]);const m=list.filter(x=>x&&x.name==='personal-growth-tracker-preview2');if(m.length>1)throw new Error('Multiple Preview 2 D1 databases; refusing ambiguity.');if(m.length===1)process.stdout.write(m[0].uuid||m[0].id||m[0].database_id||'');")"
          if [ -z "$db_id" ]; then
            echo 'Creating isolated Preview 2 D1.'
            npx --yes wrangler@4.123.0 d1 create "$target"
            npx --yes wrangler@4.123.0 d1 list --json > .preview2-d1-list.json
            db_id="$(node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('.preview2-d1-list.json','utf8'));const list=Array.isArray(raw)?raw:(raw.result||raw.databases||[]);const m=list.filter(x=>x&&x.name==='personal-growth-tracker-preview2');if(m.length!==1)throw new Error('Expected exactly one Preview 2 D1, found '+m.length);process.stdout.write(m[0].uuid||m[0].id||m[0].database_id||'');")"
          fi
          test -n "$db_id"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));const id=process.argv[1];const prod=c.d1_databases?.find(x=>x.binding==='DB')?.database_id;const p1=c.env?.preview?.d1_databases?.find(x=>x.binding==='DB')?.database_id;if(!prod||!p1)throw new Error('Production/Preview 1 D1 identities missing.');if(id===prod)throw new Error('Resolved Preview 2 D1 equals Production; refusing.');if(id===p1)throw new Error('Resolved Preview 2 D1 equals Preview 1; refusing.');" "$db_id"
          echo "Isolated Preview 2 D1 is available (id prefix: ${db_id:0:8})."
          echo 'No migrations or Worker deployment were performed by this probe.'
