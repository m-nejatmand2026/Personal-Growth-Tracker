name: Preview 2 Access Bootstrap

# Preview 2 only: authorize the repository's existing Access service token on
# the isolated Preview 2 application. Preview 1 and Production are never mutated.
on:
  push:
    branches: [feature/experience-v2]
    paths:
      - '.github/workflows/preview2-access-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: growth-compass-preview2-access-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-access:
    name: Authorize existing CI service token on isolated Preview 2
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify existing secret-backed credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"

      - name: Authorize Preview 2 service auth without mutating Preview 1 or Production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const ciClientId = process.env.CF_ACCESS_CLIENT_ID;
          const preview2Worker = 'personal-growth-tracker-preview2';
          const productionWorker = 'personal-growth-tracker';
          const preview2Host = `${preview2Worker}.m-nejatmand.workers.dev`;
          const targetPolicyName = 'Growth Compass Preview 2 CI service token';
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function raw(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${apiToken}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json().catch(() => ({}));
            return { response, body };
          }

          async function request(path, options = {}) {
            const { response, body } = await raw(path, options);
            if (!response.ok || body.success === false) {
              const message = (body.errors || []).map((e) => `${e.code ?? 'error'}: ${e.message ?? 'Cloudflare API error'}`).join('; ');
              throw new Error(`Cloudflare Access API ${response.status}: ${message || 'request failed'}`);
            }
            return body.result;
          }

          function appMatchesWorker(app, worker) {
            if (!app || typeof app !== 'object') return false;
            if (app.worker_id === worker) return true;
            if (app.name === `${worker} - Cloudflare Workers`) return true;
            if (app.domain === `${worker}.m-nejatmand.workers.dev`) return true;
            const destinations = Array.isArray(app.destinations) ? app.destinations : [];
            return destinations.some((destination) => {
              if (!destination || typeof destination !== 'object') return false;
              return Object.values(destination).some((value) => typeof value === 'string' && value.includes(worker));
            });
          }

          const isServiceAuth = (policy) => {
            if (policy?.decision !== 'non_identity') return false;
            const include = Array.isArray(policy.include) ? policy.include : [];
            return include.some((rule) => rule && typeof rule === 'object' && ('service_token' in rule || 'any_valid_service_token' in rule));
          };

          const apps = await request('/access/apps');
          const preview2Matches = apps.filter((app) => appMatchesWorker(app, preview2Worker));
          const productionMatches = apps.filter((app) => appMatchesWorker(app, productionWorker));
          if (preview2Matches.length !== 1) throw new Error(`Expected exactly one Preview 2 Worker Access app; found ${preview2Matches.length}.`);
          if (productionMatches.length > 1) throw new Error(`Ambiguous Production Access app set; found ${productionMatches.length}.`);

          const preview2 = preview2Matches[0];
          const production = productionMatches[0];
          if (!preview2.id) throw new Error('Preview 2 Access application ID is missing.');
          if (production?.id && production.id === preview2.id) {
            throw new Error('Preview 2 Access application overlaps Production; refusing mutation.');
          }

          let include;
          const tokenList = await raw('/access/service_tokens');
          if (tokenList.response.ok && tokenList.body.success !== false) {
            const tokens = Array.isArray(tokenList.body.result) ? tokenList.body.result : [];
            const matches = tokens.filter((item) => item?.client_id === ciClientId);
            if (matches.length !== 1 || !matches[0]?.id) {
              throw new Error(`Existing CI Access client ID did not resolve to exactly one active account service token; found ${matches.length}.`);
            }
            include = [{ service_token: { token_id: matches[0].id } }];
            console.log('Resolved the existing repository CI Access credential to its exact Cloudflare service-token ID.');
          } else if (tokenList.response.status === 403) {
            include = [{ any_valid_service_token: {} }];
            console.log('Service-token metadata is not readable with the existing API token; using Cloudflare any-valid-service-token only on isolated Preview 2.');
          } else {
            const message = (tokenList.body.errors || []).map((e) => `${e.code ?? 'error'}: ${e.message ?? 'Cloudflare API error'}`).join('; ');
            throw new Error(`Cloudflare service-token lookup failed with HTTP ${tokenList.response.status}: ${message || 'request failed'}`);
          }

          let policies = await request(`/access/apps/${preview2.id}/policies`);
          const named = policies.filter((policy) => policy.name === targetPolicyName);
          if (named.length > 1) throw new Error(`Multiple Preview 2 policies named ${targetPolicyName}; refusing ambiguity.`);

          let target = named[0];
          const desired = {
            name: targetPolicyName,
            decision: 'non_identity',
            include,
            exclude: [],
            require: []
          };

          if (target) {
            if (target.decision !== 'non_identity') {
              throw new Error(`Existing Preview 2 policy ${targetPolicyName} is not Service Auth; refusing replacement.`);
            }
            desired.precedence = Number.isFinite(Number(target.precedence)) ? Number(target.precedence) : 1;
            target = await request(`/access/apps/${preview2.id}/policies/${target.id}`, {
              method: 'PUT',
              body: JSON.stringify(desired)
            });
            console.log('Updated the isolated Preview 2 application-scoped Service Auth policy.');
          } else {
            const usedPrecedence = policies.map((policy) => Number(policy.precedence)).filter(Number.isFinite);
            desired.precedence = usedPrecedence.length ? Math.max(...usedPrecedence) + 1 : 1;
            target = await request(`/access/apps/${preview2.id}/policies`, {
              method: 'POST',
              body: JSON.stringify(desired)
            });
            console.log('Created the isolated Preview 2 application-scoped Service Auth policy.');
          }

          if (!target?.id || !isServiceAuth(target)) {
            throw new Error('Preview 2 Service Auth policy creation/update returned an invalid policy.');
          }

          policies = await request(`/access/apps/${preview2.id}/policies`);
          const verified = policies.find((policy) => policy.id === target.id);
          if (!verified || !isServiceAuth(verified)) {
            throw new Error('Preview 2 Service Auth policy verification failed.');
          }

          console.log(`Preview 2 CI service authentication is configured for ${preview2Host}; Production was read only and Preview 1 was not queried or mutated.`);
          NODE

      - name: Verify protected selector, both experiences and D1 health
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          base='https://personal-growth-tracker-preview2.m-nejatmand.workers.dev'

          unauth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/api/health")"
          case "$unauth_status" in
            2??)
              echo "Unauthenticated Preview 2 health returned HTTP $unauth_status; Access boundary missing."
              exit 1
              ;;
            *) echo "Anonymous Preview 2 health is blocked as expected (HTTP $unauth_status)." ;;
          esac

          auth_get() {
            local path="$1"
            local label="$2"
            local body_file
            local status
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --output "$body_file" --write-out '%{http_code}' --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$base$path")"
            echo "Authenticated Preview 2 $label HTTP $status" >&2
            case "$status" in
              2??) cat "$body_file"; rm -f "$body_file" ;;
              *) rm -f "$body_file"; return 1 ;;
            esac
          }

          selector="$(auth_get '/' 'selector')"
          printf '%s' "$selector" | grep -F 'Experience 1' >/dev/null
          printf '%s' "$selector" | grep -F 'Current / Recovered' >/dev/null
          printf '%s' "$selector" | grep -F '/experience/1/' >/dev/null
          printf '%s' "$selector" | grep -F 'Experience 2' >/dev/null
          printf '%s' "$selector" | grep -F 'New / Ambient Luxury' >/dev/null
          printf '%s' "$selector" | grep -F '/experience/2/' >/dev/null

          experience1="$(auth_get '/experience/1/' 'Experience 1')"
          printf '%s' "$experience1" | grep -F '<title>Growth Compass</title>' >/dev/null
          printf '%s' "$experience1" | grep -F '/experience/1/manifest.webmanifest' >/dev/null

          experience2="$(auth_get '/experience/2/' 'Experience 2')"
          printf '%s' "$experience2" | grep -F 'Experience 2' >/dev/null
          printf '%s' "$experience2" | grep -F 'Ambient Luxury' >/dev/null

          health="$(auth_get '/api/health' 'D1 health')"
          printf '%s' "$health" | grep -F '"status":"ok"' >/dev/null
          printf '%s' "$health" | grep -F '"database":"ok"' >/dev/null

          echo "Preview 2 Access + selector + both experiences + D1 health passed: $base"
