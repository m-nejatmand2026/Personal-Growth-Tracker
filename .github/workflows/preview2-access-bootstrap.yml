name: Preview 2 Access Bootstrap

on:
  push:
    branches: [feature/experience-v2]
    paths:
      - '.github/workflows/preview2-access-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: growth-compass-preview2-access-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-access:
    name: Reuse Preview 1 service auth on isolated Preview 2
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify existing secret-backed credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"

      - name: Clone only Preview 1 service-auth policy to Preview 2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const preview1Worker = 'personal-growth-tracker-preview';
          const preview2Worker = 'personal-growth-tracker-preview2';
          const productionWorker = 'personal-growth-tracker';
          const preview2Host = `${preview2Worker}.m-nejatmand.workers.dev`;
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              const message = (body.errors || []).map((e) => `${e.code ?? 'error'}: ${e.message ?? 'Cloudflare API error'}`).join('; ');
              throw new Error(`Cloudflare Access API ${response.status}: ${message || 'request failed'}`);
            }
            return body.result;
          }

          function appMatchesWorker(app, worker) {
            if (!app || typeof app !== 'object') return false;
            if (app.worker_id === worker) return true;
            if (app.name === `${worker} - Cloudflare Workers`) return true;
            if (app.domain === `${worker}.m-nejatmand.workers.dev`) return true;
            const destinations = Array.isArray(app.destinations) ? app.destinations : [];
            return destinations.some((destination) => {
              if (!destination || typeof destination !== 'object') return false;
              if (destination.uri === worker || destination.hostname === worker) return true;
              return Object.values(destination).some((value) => typeof value === 'string' && value.includes(worker));
            });
          }

          const apps = await request('/access/apps');
          const preview1Matches = apps.filter((app) => appMatchesWorker(app, preview1Worker));
          const preview2Matches = apps.filter((app) => appMatchesWorker(app, preview2Worker));
          const productionMatches = apps.filter((app) => appMatchesWorker(app, productionWorker));

          if (preview1Matches.length !== 1) throw new Error(`Expected exactly one Preview 1 Worker Access app; found ${preview1Matches.length}.`);
          if (preview2Matches.length !== 1) throw new Error(`Expected exactly one Preview 2 Worker Access app; found ${preview2Matches.length}.`);
          if (productionMatches.length > 1) throw new Error(`Ambiguous Production Access app set; found ${productionMatches.length}.`);

          const preview1 = preview1Matches[0];
          const preview2 = preview2Matches[0];
          const production = productionMatches[0];

          if (!preview1.id || !preview2.id) throw new Error('Access application IDs are missing.');
          if (preview1.id === preview2.id) throw new Error('Preview 1 and Preview 2 Access applications unexpectedly share an ID.');
          if (production && (preview2.id === production.id || preview1.id === production.id)) {
            throw new Error('Preview Access application overlaps Production; refusing mutation.');
          }
          if (!appMatchesWorker(preview2, preview2Worker)) throw new Error('Resolved target is not the isolated Preview 2 Worker.');

          const sourcePolicies = await request(`/access/apps/${preview1.id}/policies`);
          const targetPolicies = await request(`/access/apps/${preview2.id}/policies`);

          const isServiceAuth = (policy) => {
            if (policy?.decision !== 'non_identity') return false;
            const include = Array.isArray(policy.include) ? policy.include : [];
            return include.some((rule) => rule && typeof rule === 'object' && ('service_token' in rule || 'any_valid_service_token' in rule));
          };

          const sourceServicePolicies = sourcePolicies.filter(isServiceAuth);
          if (sourceServicePolicies.length !== 1) {
            throw new Error(`Expected exactly one Preview 1 service-auth policy; found ${sourceServicePolicies.length}.`);
          }

          const source = sourceServicePolicies[0];
          const existingTargetServicePolicies = targetPolicies.filter(isServiceAuth);
          if (existingTargetServicePolicies.length > 1) {
            throw new Error(`Preview 2 has ${existingTargetServicePolicies.length} service-auth policies; refusing ambiguity.`);
          }

          if (existingTargetServicePolicies.length === 0) {
            const body = {
              name: 'Preview 2 CI service token',
              decision: 'non_identity',
              include: source.include || [],
              exclude: source.exclude || [],
              require: source.require || []
            };
            if (Number.isInteger(source.precedence)) body.precedence = source.precedence;
            if (source.session_duration) body.session_duration = source.session_duration;

            await request(`/access/apps/${preview2.id}/policies`, {
              method: 'POST',
              body: JSON.stringify(body)
            });
            console.log('Created Preview 2 service-auth policy by copying only Preview 1 service-auth selectors.');
          } else {
            console.log('Preview 2 already has exactly one service-auth policy; no Access mutation needed.');
          }

          const finalPolicies = await request(`/access/apps/${preview2.id}/policies`);
          const finalServicePolicies = finalPolicies.filter(isServiceAuth);
          if (finalServicePolicies.length !== 1) {
            throw new Error(`Preview 2 service-auth policy verification failed; found ${finalServicePolicies.length}.`);
          }

          console.log(`Preview 2 Access service auth ready for ${preview2Host}; Preview 1 and Production were read only.`);
          NODE

      - name: Verify protected selector, both experiences and D1 health
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          base='https://personal-growth-tracker-preview2.m-nejatmand.workers.dev'

          unauth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/api/health")"
          case "$unauth_status" in
            2??)
              echo "Unauthenticated Preview 2 health returned HTTP $unauth_status; Access boundary missing."
              exit 1
              ;;
          esac

          curl_args=(
            --fail
            --silent
            --show-error
            --retry 5
            --retry-delay 2
            --retry-all-errors
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          )

          selector="$(curl "${curl_args[@]}" "$base/")"
          printf '%s' "$selector" | grep -F 'Experience 1' >/dev/null
          printf '%s' "$selector" | grep -F 'Current / Recovered' >/dev/null
          printf '%s' "$selector" | grep -F '/experience/1/' >/dev/null
          printf '%s' "$selector" | grep -F 'Experience 2' >/dev/null
          printf '%s' "$selector" | grep -F 'New / Ambient Luxury' >/dev/null
          printf '%s' "$selector" | grep -F '/experience/2/' >/dev/null

          experience1="$(curl "${curl_args[@]}" "$base/experience/1/")"
          printf '%s' "$experience1" | grep -F '<title>Growth Compass</title>' >/dev/null
          printf '%s' "$experience1" | grep -F '/experience/1/manifest.webmanifest' >/dev/null

          experience2="$(curl "${curl_args[@]}" "$base/experience/2/")"
          printf '%s' "$experience2" | grep -F 'Experience 2' >/dev/null
          printf '%s' "$experience2" | grep -F 'Ambient Luxury' >/dev/null

          health="$(curl "${curl_args[@]}" "$base/api/health")"
          printf '%s' "$health" | grep -F '"status":"ok"' >/dev/null
          printf '%s' "$health" | grep -F '"database":"ok"' >/dev/null

          echo "Preview 2 Access + selector + both experiences + D1 health passed: $base"
