name: Preview 2 Access Bootstrap

on:
  push:
    branches: [feature/experience-v2]
    paths:
      - '.github/workflows/preview2-access-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: growth-compass-preview2-access-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-access:
    name: Clone protected Preview 1 Access boundary to Preview 2
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify existing secret-backed credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"

      - name: Clone Preview 1 Access application and policies safely
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const sourceDomain = 'personal-growth-tracker-preview.m-nejatmand.workers.dev';
          const targetDomain = 'personal-growth-tracker-preview2.m-nejatmand.workers.dev';
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function cf(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              const message = (body.errors || []).map((e) => `${e.code ?? 'error'}: ${e.message ?? 'Cloudflare API error'}`).join('; ');
              throw new Error(`Cloudflare Access API ${response.status}: ${message || 'request failed'}`);
            }
            return body.result;
          }

          const apps = await cf('/access/apps');
          const sourceMatches = apps.filter((app) => app.domain === sourceDomain);
          const targetMatches = apps.filter((app) => app.domain === targetDomain);
          if (sourceMatches.length !== 1) throw new Error(`Expected exactly one Preview 1 Access app for ${sourceDomain}; found ${sourceMatches.length}.`);
          if (targetMatches.length > 1) throw new Error(`Multiple Preview 2 Access apps found for ${targetDomain}; refusing ambiguity.`);

          const source = sourceMatches[0];
          let target = targetMatches[0];
          if (!target) {
            const createBody = {
              name: 'Growth Compass Preview 2',
              domain: targetDomain,
              type: source.type || 'self_hosted',
              session_duration: source.session_duration || '24h',
              auto_redirect_to_identity: Boolean(source.auto_redirect_to_identity),
              http_only_cookie_attribute: Boolean(source.http_only_cookie_attribute),
              options_preflight_bypass: Boolean(source.options_preflight_bypass),
              skip_interstitial: Boolean(source.skip_interstitial),
              app_launcher_visible: source.app_launcher_visible !== false
            };
            target = await cf('/access/apps', { method: 'POST', body: JSON.stringify(createBody) });
            console.log('Created isolated Preview 2 Access application for the exact Preview 2 hostname.');
          } else {
            console.log('Preview 2 Access application already exists for the exact Preview 2 hostname.');
          }

          if (!target?.id || target.domain !== targetDomain) throw new Error('Resolved Preview 2 Access application identity is invalid.');
          if (target.id === source.id) throw new Error('Preview 2 Access app unexpectedly equals Preview 1 app; refusing mutation.');

          const sourcePolicies = await cf(`/access/apps/${source.id}/policies`);
          if (!Array.isArray(sourcePolicies) || sourcePolicies.length === 0) throw new Error('Preview 1 Access app has no policies to clone.');
          const targetPolicies = await cf(`/access/apps/${target.id}/policies`);
          const targetNames = new Set(targetPolicies.map((p) => p.name));

          let created = 0;
          for (const policy of sourcePolicies) {
            if (targetNames.has(policy.name)) continue;
            const body = {
              name: policy.name,
              decision: policy.decision,
              precedence: policy.precedence,
              include: policy.include || [],
              exclude: policy.exclude || [],
              require: policy.require || []
            };
            if (policy.session_duration) body.session_duration = policy.session_duration;
            await cf(`/access/apps/${target.id}/policies`, { method: 'POST', body: JSON.stringify(body) });
            created += 1;
          }

          const finalPolicies = await cf(`/access/apps/${target.id}/policies`);
          if (finalPolicies.length < sourcePolicies.length) {
            throw new Error(`Preview 2 Access policy clone incomplete: source=${sourcePolicies.length}, target=${finalPolicies.length}.`);
          }
          console.log(`Preview 2 Access boundary ready; source policy count=${sourcePolicies.length}, target policy count=${finalPolicies.length}, newly created=${created}.`);
          NODE

      - name: Verify protected selector, both experiences and D1 health
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          base='https://personal-growth-tracker-preview2.m-nejatmand.workers.dev'

          unauth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/api/health")"
          case "$unauth_status" in
            2??)
              echo "Unauthenticated Preview 2 health returned HTTP $unauth_status; Access boundary missing."
              exit 1
              ;;
          esac

          curl_args=(
            --fail
            --silent
            --show-error
            --retry 5
            --retry-delay 2
            --retry-all-errors
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          )

          selector="$(curl "${curl_args[@]}" "$base/")"
          printf '%s' "$selector" | grep -F 'Experience 1' >/dev/null
          printf '%s' "$selector" | grep -F 'Current / Recovered' >/dev/null
          printf '%s' "$selector" | grep -F '/experience/1/' >/dev/null
          printf '%s' "$selector" | grep -F 'Experience 2' >/dev/null
          printf '%s' "$selector" | grep -F 'New / Ambient Luxury' >/dev/null
          printf '%s' "$selector" | grep -F '/experience/2/' >/dev/null

          experience1="$(curl "${curl_args[@]}" "$base/experience/1/")"
          printf '%s' "$experience1" | grep -F '<title>Growth Compass</title>' >/dev/null
          printf '%s' "$experience1" | grep -F '/experience/1/manifest.webmanifest' >/dev/null

          experience2="$(curl "${curl_args[@]}" "$base/experience/2/")"
          printf '%s' "$experience2" | grep -F 'Experience 2' >/dev/null
          printf '%s' "$experience2" | grep -F 'Ambient Luxury' >/dev/null

          health="$(curl "${curl_args[@]}" "$base/api/health")"
          printf '%s' "$health" | grep -F '"status":"ok"' >/dev/null
          printf '%s' "$health" | grep -F '"database":"ok"' >/dev/null

          echo "Preview 2 Access + selector + both experiences + D1 health passed: $base"
