name: Preview 2 Access Bootstrap

on:
  push:
    branches: [feature/experience-v2]
    paths:
      - '.github/workflows/preview2-access-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: growth-compass-preview2-access-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-access:
    name: Protect isolated Preview 2 with existing Access credentials
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify existing secret-backed credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OWNER_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          test -n "$OWNER_EMAIL"
          case "$OWNER_EMAIL" in *@*) ;; *) echo 'Push author email is unavailable; refusing to create an owner Access rule.'; exit 1;; esac

      - name: Create isolated Preview 2 Access boundary only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          OWNER_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const accessClientId = process.env.CF_ACCESS_CLIENT_ID;
          const ownerEmail = process.env.OWNER_EMAIL;
          const targetDomain = 'personal-growth-tracker-preview2.m-nejatmand.workers.dev';
          const protectedPreview1Domain = 'personal-growth-tracker-preview.m-nejatmand.workers.dev';
          const productionDomain = 'personal-growth-tracker.m-nejatmand.workers.dev';
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function request(path, options = {}, { allowFailure = false } = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              if (allowFailure) return { ok: false, status: response.status, body };
              const message = (body.errors || []).map((e) => `${e.code ?? 'error'}: ${e.message ?? 'Cloudflare API error'}`).join('; ');
              throw new Error(`Cloudflare Access API ${response.status}: ${message || 'request failed'}`);
            }
            return { ok: true, status: response.status, result: body.result };
          }

          const appsResult = await request('/access/apps');
          const apps = appsResult.result || [];
          const targetMatches = apps.filter((app) => app.domain === targetDomain);
          if (targetMatches.length > 1) throw new Error(`Multiple Preview 2 Access apps found for ${targetDomain}; refusing ambiguity.`);
          if (targetDomain === protectedPreview1Domain || targetDomain === productionDomain) throw new Error('Preview 2 Access target overlaps a protected environment; refusing mutation.');

          let target = targetMatches[0];
          if (!target) {
            const createBody = {
              name: 'Growth Compass Preview 2',
              domain: targetDomain,
              type: 'self_hosted',
              session_duration: '24h',
              auto_redirect_to_identity: false,
              app_launcher_visible: false
            };
            target = (await request('/access/apps', { method: 'POST', body: JSON.stringify(createBody) })).result;
            console.log('Created Access application for the exact isolated Preview 2 hostname.');
          } else {
            console.log('Preview 2 Access application already exists for the exact isolated hostname.');
          }
          if (!target?.id || target.domain !== targetDomain) throw new Error('Resolved Preview 2 Access application identity is invalid.');

          let serviceRule = { any_valid_service_token: {} };
          const serviceTokens = await request('/access/service_tokens?per_page=1000', {}, { allowFailure: true });
          if (serviceTokens.ok) {
            const matches = (serviceTokens.result || []).filter((item) => item.client_id === accessClientId);
            if (matches.length !== 1) throw new Error(`Expected exactly one existing CI Access service token matching the stored client ID; found ${matches.length}.`);
            serviceRule = { service_token: { token_id: matches[0].id } };
            console.log('Resolved the existing CI Access service token exactly.');
          } else {
            console.log('Service-token metadata is not readable by this API token; restricting CI to valid account Access service tokens without creating a new credential.');
          }

          const existingPolicies = (await request(`/access/apps/${target.id}/policies`)).result || [];
          const byName = new Map(existingPolicies.map((policy) => [policy.name, policy]));

          if (!byName.has('Preview 2 CI service token')) {
            await request(`/access/apps/${target.id}/policies`, {
              method: 'POST',
              body: JSON.stringify({
                name: 'Preview 2 CI service token',
                decision: 'non_identity',
                precedence: 1,
                include: [serviceRule],
                exclude: [],
                require: []
              })
            });
            console.log('Created Preview 2 CI service-auth policy using the existing Access credential.');
          }

          if (!byName.has('Preview 2 owner')) {
            await request(`/access/apps/${target.id}/policies`, {
              method: 'POST',
              body: JSON.stringify({
                name: 'Preview 2 owner',
                decision: 'allow',
                precedence: 2,
                include: [{ email: { email: ownerEmail } }],
                exclude: [],
                require: []
              })
            });
            console.log('Created the owner-only interactive Preview 2 Access policy.');
          }

          const finalPolicies = (await request(`/access/apps/${target.id}/policies`)).result || [];
          const finalNames = new Set(finalPolicies.map((policy) => policy.name));
          if (!finalNames.has('Preview 2 CI service token') || !finalNames.has('Preview 2 owner')) {
            throw new Error('Preview 2 Access policy bootstrap is incomplete.');
          }
          console.log('Preview 2 Access application and required policies are configured without changing Preview 1 or Production.');
          NODE

      - name: Verify protected selector, both experiences and D1 health
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          base='https://personal-growth-tracker-preview2.m-nejatmand.workers.dev'

          unauth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/api/health")"
          case "$unauth_status" in
            2??)
              echo "Unauthenticated Preview 2 health returned HTTP $unauth_status; Access boundary missing."
              exit 1
              ;;
          esac

          curl_args=(
            --fail
            --silent
            --show-error
            --retry 5
            --retry-delay 2
            --retry-all-errors
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          )

          selector="$(curl "${curl_args[@]}" "$base/")"
          printf '%s' "$selector" | grep -F 'Experience 1' >/dev/null
          printf '%s' "$selector" | grep -F 'Current / Recovered' >/dev/null
          printf '%s' "$selector" | grep -F '/experience/1/' >/dev/null
          printf '%s' "$selector" | grep -F 'Experience 2' >/dev/null
          printf '%s' "$selector" | grep -F 'New / Ambient Luxury' >/dev/null
          printf '%s' "$selector" | grep -F '/experience/2/' >/dev/null

          experience1="$(curl "${curl_args[@]}" "$base/experience/1/")"
          printf '%s' "$experience1" | grep -F '<title>Growth Compass</title>' >/dev/null
          printf '%s' "$experience1" | grep -F '/experience/1/manifest.webmanifest' >/dev/null

          experience2="$(curl "${curl_args[@]}" "$base/experience/2/")"
          printf '%s' "$experience2" | grep -F 'Experience 2' >/dev/null
          printf '%s' "$experience2" | grep -F 'Ambient Luxury' >/dev/null

          health="$(curl "${curl_args[@]}" "$base/api/health")"
          printf '%s' "$health" | grep -F '"status":"ok"' >/dev/null
          printf '%s' "$health" | grep -F '"database":"ok"' >/dev/null

          echo "Preview 2 Access + selector + both experiences + D1 health passed: $base"
