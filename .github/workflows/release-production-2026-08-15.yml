name: One-time Production Release 2026-08-15

on:
  schedule:
    - cron: '25 5 15 8 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-compass-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release accepted checkpoint to production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_SHA: 7ba6b0427cb120002ef586231da7349a50460165
      EXPECTED_REPOSITORY: m-nejatmand2026/Personal-Growth-Tracker
      EXPECTED_PRODUCTION_DB_ID: a182d8c8-c009-461e-ac7e-04694c1047ab
      EXPECTED_PREVIEW_DB_ID: 1937971c-f2f2-4dad-bc65-3d22952584bb
      EXPECTED_WORKER: personal-growth-tracker
      PRODUCTION_URL: https://personal-growth-tracker.m-nejatmand.workers.dev
      CI: "true"
    steps:
      - name: Date guard and trusted repository check
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(date -u +%F)" = "2026-08-15" || { echo 'One-time release window is closed.'; exit 1; }

      - name: Checkout exact accepted release SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify exact release and production resource contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const db = config.d1_databases?.find((item) => item.binding === 'DB');
          const preview = config.env?.preview?.d1_databases?.find((item) => item.binding === 'DB');
          if (config.name !== process.env.EXPECTED_WORKER) throw new Error(`Unexpected production Worker: ${config.name}`);
          if (!db || db.database_id !== process.env.EXPECTED_PRODUCTION_DB_ID) throw new Error(`Unexpected production DB identity: ${db?.database_id}`);
          if (db.database_name !== process.env.EXPECTED_WORKER) throw new Error(`Unexpected production DB name: ${db.database_name}`);
          if (db.database_id === process.env.EXPECTED_PREVIEW_DB_ID) throw new Error('Production DB points to Preview.');
          if (!preview || preview.database_id === db.database_id) throw new Error('Preview/Production D1 isolation is invalid.');
          if (config.observability?.enabled !== true) throw new Error('Production observability must remain enabled.');
          NODE

      - name: Verify Cloudflare release credentials exist
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.'; exit 1; }

      - name: Review exact pending Production migrations
        id: migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.123.0 d1 migrations list DB --remote 2>&1)"
          printf '%s\n' "$output"
          pending="$(printf '%s\n' "$output" | grep -oE '[0-9]{4}_[A-Za-z0-9_-]+\.sql' | sort -u || true)"
          unknown="$(printf '%s\n' "$pending" | grep -vE '^(0006_activities_contract\.sql|0007_wellbeing_energy\.sql)$' || true)"
          if [ -n "$unknown" ]; then
            echo 'Unexpected Production migration(s) detected:'
            printf '%s\n' "$unknown"
            exit 1
          fi
          if printf '%s\n' "$output" | grep -F 'No migrations to apply' >/dev/null; then
            echo 'needs_apply=false' >> "$GITHUB_OUTPUT"
          else
            test -n "$pending" || { echo 'Could not identify pending migration filenames safely.'; exit 1; }
            echo 'Approved pending migration set:'
            printf '%s\n' "$pending"
            echo 'needs_apply=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Record Production D1 Time Travel checkpoint
        if: steps.migrations.outputs.needs_apply == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '=== PRE-MIGRATION PRODUCTION TIME TRAVEL CHECKPOINT ==='
          npx --yes wrangler@4.123.0 d1 time-travel info DB

      - name: Apply reviewed Production migrations
        if: steps.migrations.outputs.needs_apply == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 migrations apply DB --remote

      - name: Verify Production migration state and integrity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.123.0 d1 migrations list DB --remote 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'No migrations to apply' >/dev/null
          npx --yes wrangler@4.123.0 d1 execute DB --remote --command='PRAGMA quick_check;'
          npx --yes wrangler@4.123.0 d1 execute DB --remote --command='PRAGMA foreign_key_check;'
          npx --yes wrangler@4.123.0 d1 execute DB --remote --command='PRAGMA optimize;'
          npx --yes wrangler@4.123.0 d1 execute DB --remote --command='PRAGMA quick_check;'

      - name: Production Worker dry run
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.123.0 deploy --dry-run --name "$EXPECTED_WORKER" 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'personal-growth-tracker' >/dev/null
          if printf '%s\n' "$output" | grep -F 'personal-growth-tracker-preview' >/dev/null; then
            echo 'Preview resource appeared in Production dry-run. Refusing deployment.'
            exit 1
          fi

      - name: Deploy exact accepted SHA to Production
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 deploy --name "$EXPECTED_WORKER" --message "git:$RELEASE_SHA" | tee /tmp/production-deploy.log
          version_id="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/production-deploy.log | tail -1 | awk '{print $4}')"
          test -n "$version_id" || { echo 'Could not record Production Worker Version ID.'; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "Production Worker Version ID: $version_id"

      - name: Verify Production Access boundary and authenticated smoke
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          unauth_health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/api/health")"
          case "$unauth_health" in
            2??)
              echo "Unauthenticated Production API returned HTTP $unauth_health. Access is not enforced."
              exit 1
              ;;
          esac
          echo "Unauthenticated Production API remains Access-protected (HTTP $unauth_health)."

          test -n "$CF_ACCESS_CLIENT_ID" || { echo 'Missing Access client ID for authenticated Production smoke.'; exit 1; }
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo 'Missing Access client secret for authenticated Production smoke.'; exit 1; }
          curl_args=(
            --fail
            --silent
            --show-error
            --retry 4
            --retry-delay 2
            --retry-all-errors
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          )
          body="$(curl "${curl_args[@]}" "$PRODUCTION_URL/")"
          printf '%s' "$body" | grep -F 'Growth Compass' >/dev/null
          health="$(curl "${curl_args[@]}" "$PRODUCTION_URL/api/health")"
          printf '%s' "$health" | grep -F '"status":"ok"' >/dev/null
          printf '%s' "$health" | grep -F '"database":"ok"' >/dev/null
          echo 'Authenticated Production root + D1 health smoke passed.'

      - name: Release summary
        shell: bash
        run: |
          {
            echo '## Growth Compass Production Release'
            echo
            echo "- Git SHA: \`$RELEASE_SHA\`"
            echo "- Worker: \`$EXPECTED_WORKER\`"
            echo "- Production URL: $PRODUCTION_URL"
            echo "- Worker Version ID: \`${{ steps.deploy.outputs.version_id }}\`"
            echo '- Production migration state: no pending migrations'
            echo '- Production Access boundary + authenticated root/D1 smoke: passed'
          } >> "$GITHUB_STEP_SUMMARY"
