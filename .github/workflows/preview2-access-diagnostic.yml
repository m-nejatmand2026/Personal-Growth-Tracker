name: Preview 2 Access Diagnostic

on:
  push:
    branches: [feature/experience-v2]
    paths:
      - '.github/workflows/preview2-access-diagnostic.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    name: Diagnose isolated Preview 2 Access
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve sanitized Preview 2 Access audience state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const cfToken = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const clientId = String(process.env.CF_ACCESS_CLIENT_ID || '').trim();
          const clientSecret = String(process.env.CF_ACCESS_CLIENT_SECRET || '').trim();
          const ghToken = process.env.GH_STATUS_TOKEN;
          const host = 'personal-growth-tracker-preview2.m-nejatmand.workers.dev';
          const cfBase = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function cf(path) {
            const response = await fetch(cfBase + path, {
              headers: { Authorization: `Bearer ${cfToken}`, 'Content-Type': 'application/json' }
            });
            const body = await response.json().catch(() => ({}));
            return { status: response.status, ok: response.ok && body.success !== false, result: body.result };
          }

          const anonymous = await fetch(`https://${host}/`, { redirect: 'manual' });
          const location = anonymous.headers.get('location') || '';
          let aud = '';
          let teamHost = '';
          try {
            const login = new URL(location);
            teamHost = login.hostname;
            aud = login.searchParams.get('aud') || login.searchParams.get('kid') || '';
            if (!aud) {
              const redirectUrl = login.searchParams.get('redirect_url');
              if (redirectUrl) {
                const nested = new URL(redirectUrl);
                aud = nested.searchParams.get('aud') || '';
              }
            }
          } catch {}

          const audResponse = aud
            ? await cf(`/access/apps?per_page=1000&aud=${encodeURIComponent(aud)}`)
            : { status: 0, ok: false, result: [] };
          const audApps = audResponse.ok && Array.isArray(audResponse.result) ? audResponse.result : [];
          let policyStatus = 0;
          let policies = [];
          if (audApps.length === 1 && audApps[0]?.id) {
            const p = await cf(`/access/apps/${audApps[0].id}/policies?per_page=1000`);
            policyStatus = p.status;
            policies = p.ok && Array.isArray(p.result) ? p.result : [];
          }
          const serviceAuth = policies.filter((policy) => policy?.decision === 'non_identity');
          const hasService = serviceAuth.some((policy) => (policy.include || []).some((rule) => rule && typeof rule === 'object' && 'service_token' in rule));
          const hasAnyService = serviceAuth.some((policy) => (policy.include || []).some((rule) => rule && typeof rule === 'object' && 'any_valid_service_token' in rule));

          const tokenResponse = await cf('/access/service_tokens?per_page=1000');
          const tokens = tokenResponse.ok && Array.isArray(tokenResponse.result) ? tokenResponse.result : [];
          const tokenMatches = tokenResponse.ok ? tokens.filter((item) => item?.client_id === clientId).length : -1;

          const authenticated = await fetch(`https://${host}/`, {
            redirect: 'manual',
            headers: {
              'CF-Access-Client-Id': clientId,
              'CF-Access-Client-Secret': clientSecret
            }
          });

          const compact = [
            `R${anonymous.status}-a${aud ? 1 : 0}-t${teamHost ? 1 : 0}`,
            `Q${audResponse.status}-${audApps.length}`,
            `P${policyStatus}-${policies.length}-s${serviceAuth.length}-${hasService ? 1 : 0}${hasAnyService ? 1 : 0}`,
            `T${tokenResponse.status}-m${tokenMatches}`,
            `H${authenticated.status}`
          ].join('_');
          console.log(compact);

          const statusResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${ghToken}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state: authenticated.status >= 200 && authenticated.status < 300 ? 'success' : 'failure',
              context: `preview2/access-diagnostic/${compact}`.slice(0, 100),
              description: 'Sanitized Preview 2 audience diagnostic'
            })
          });
          if (!statusResponse.ok) throw new Error(`GitHub status publish failed: ${statusResponse.status}`);
          NODE
