name: Preview 2 Access Diagnostic

on:
  push:
    branches: [feature/experience-v2]
    paths:
      - '.github/workflows/preview2-access-diagnostic.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    name: Diagnose isolated Preview 2 Access
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe sanitized Preview 2 Access capabilities
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const cfToken = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const clientId = String(process.env.CF_ACCESS_CLIENT_ID || '').trim();
          const clientSecret = String(process.env.CF_ACCESS_CLIENT_SECRET || '').trim();
          const ghToken = process.env.GH_STATUS_TOKEN;
          const host = 'personal-growth-tracker-preview2.m-nejatmand.workers.dev';
          const cfBase = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function cf(path, options = {}) {
            const response = await fetch(cfBase + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${cfToken}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json().catch(() => ({}));
            return { status: response.status, ok: response.ok && body.success !== false, result: body.result };
          }

          const tokenList = await cf('/access/service_tokens?per_page=1000');
          const tokens = tokenList.ok && Array.isArray(tokenList.result) ? tokenList.result : [];
          const tokenMatches = tokenList.ok ? tokens.filter((item) => item?.client_id === clientId).length : -1;

          // Intentionally invalid bodies: authorization is checked, but no object can be created.
          const tokenWriteProbe = await cf('/access/service_tokens', {
            method: 'POST',
            body: JSON.stringify({})
          });
          const appWriteProbe = await cf('/access/apps', {
            method: 'POST',
            body: JSON.stringify({})
          });

          const authenticated = await fetch(`https://${host}/`, {
            redirect: 'manual',
            headers: {
              'CF-Access-Client-Id': clientId,
              'CF-Access-Client-Secret': clientSecret
            }
          });

          const compact = [
            `TL${tokenList.status}-m${tokenMatches}`,
            `TW${tokenWriteProbe.status}`,
            `AW${appWriteProbe.status}`,
            `H${authenticated.status}`
          ].join('_');
          console.log(compact);

          const statusResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${ghToken}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state: authenticated.status >= 200 && authenticated.status < 300 ? 'success' : 'failure',
              context: `preview2/access-diagnostic/${compact}`.slice(0, 100),
              description: 'Sanitized Preview 2 permission diagnostic'
            })
          });
          if (!statusResponse.ok) throw new Error(`GitHub status publish failed: ${statusResponse.status}`);
          NODE
