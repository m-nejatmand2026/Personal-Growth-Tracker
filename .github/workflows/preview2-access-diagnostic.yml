name: Preview 2 Access Diagnostic

on:
  push:
    branches: [feature/experience-v2]
    paths:
      - '.github/workflows/preview2-access-diagnostic.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    name: Diagnose isolated Preview 2 Access
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read sanitized Preview 2 Access state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const cfToken = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const rawClientId = process.env.CF_ACCESS_CLIENT_ID || '';
          const rawClientSecret = process.env.CF_ACCESS_CLIENT_SECRET || '';
          const ghToken = process.env.GH_STATUS_TOKEN;
          const worker = 'personal-growth-tracker-preview2';
          const host = `${worker}.m-nejatmand.workers.dev`;
          const cfBase = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          const normalize = (value) => {
            let normalized = String(value || '').trim();
            if ((normalized.startsWith('"') && normalized.endsWith('"')) || (normalized.startsWith("'") && normalized.endsWith("'"))) normalized = normalized.slice(1, -1).trim();
            return normalized;
          };
          const clientId = normalize(rawClientId);
          const clientSecret = normalize(rawClientSecret);

          async function cf(path) {
            const response = await fetch(cfBase + path, { headers: { Authorization: `Bearer ${cfToken}`, 'Content-Type': 'application/json' } });
            const body = await response.json().catch(() => ({}));
            return { status: response.status, ok: response.ok && body.success !== false, result: body.result };
          }

          function stringMatchesWorker(value) {
            if (typeof value !== 'string') return false;
            if (value === worker || value === host) return true;
            const cleaned = value.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
            return cleaned === host;
          }

          function localMatch(app) {
            if (!app || typeof app !== 'object') return false;
            if (app.name === 'Growth Compass Preview 2') return true;
            if (app.worker_id === worker || app.name === `${worker} - Cloudflare Workers` || stringMatchesWorker(app.domain)) return true;
            return (Array.isArray(app.destinations) ? app.destinations : []).some((destination) =>
              destination && typeof destination === 'object' && Object.values(destination).some(stringMatchesWorker));
          }

          const appsResponse = await cf('/access/apps?per_page=1000');
          const allApps = appsResponse.ok && Array.isArray(appsResponse.result) ? appsResponse.result : [];
          const localMatches = allApps.filter(localMatch);
          const allWorkers = allApps.filter((app) => (app.destinations || []).some((destination) => destination?.type === 'all_workers'));
          const workerDestinations = allApps.filter((app) => (app.destinations || []).some((destination) => destination?.type === 'worker'));

          const targetQuery = encodeURIComponent(`worker_id=${worker}`);
          const targetResponse = await cf(`/access/apps?per_page=1000&target_attributes=${targetQuery}`);
          const targetMatches = targetResponse.ok && Array.isArray(targetResponse.result) ? targetResponse.result : [];
          const domainResponse = await cf(`/access/apps?per_page=1000&exact=true&domain=${encodeURIComponent(host)}`);
          const domainMatches = domainResponse.ok && Array.isArray(domainResponse.result) ? domainResponse.result : [];

          const tokenResponse = await cf('/access/service_tokens?per_page=1000');
          const tokenList = tokenResponse.ok && Array.isArray(tokenResponse.result) ? tokenResponse.result : [];
          const rawMatches = tokenResponse.ok ? tokenList.filter((item) => item?.client_id === rawClientId).length : -1;
          const normalizedMatches = tokenResponse.ok ? tokenList.filter((item) => item?.client_id === clientId).length : -1;

          const authResponse = await fetch(`https://${host}/`, {
            redirect: 'manual',
            headers: { 'CF-Access-Client-Id': clientId, 'CF-Access-Client-Secret': clientSecret }
          });

          const compact = [
            `A${appsResponse.status}-${allApps.length}`,
            `l${localMatches.length}`,
            `aw${allWorkers.length}`,
            `wd${workerDestinations.length}`,
            `q${targetResponse.status}-${targetMatches.length}`,
            `d${domainResponse.status}-${domainMatches.length}`,
            `t${tokenResponse.status}-r${rawMatches}-n${normalizedMatches}`,
            `h${authResponse.status}`
          ].join('_');
          console.log(compact);

          const state = authResponse.status >= 200 && authResponse.status < 300 ? 'success' : 'failure';
          const statusResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${ghToken}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
            body: JSON.stringify({ state, context: `preview2/access-diagnostic/${compact}`.slice(0, 100), description: 'Sanitized Preview 2 Access diagnostic' })
          });
          if (!statusResponse.ok) throw new Error(`GitHub status publish failed: ${statusResponse.status}`);
          NODE
