name: Preview 2 Access Diagnostic

on:
  push:
    branches: [feature/experience-v2]
    paths:
      - '.github/workflows/preview2-access-diagnostic.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    name: Diagnose isolated Preview 2 Access
    if: github.repository == 'm-nejatmand2026/Personal-Growth-Tracker' && github.ref == 'refs/heads/feature/experience-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read sanitized Preview 2 Access state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const cfToken = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const clientId = String(process.env.CF_ACCESS_CLIENT_ID || '').trim();
          const clientSecret = String(process.env.CF_ACCESS_CLIENT_SECRET || '').trim();
          const ghToken = process.env.GH_STATUS_TOKEN;
          const worker = 'personal-growth-tracker-preview2';
          const host = `${worker}.m-nejatmand.workers.dev`;
          const expectedPolicyNames = new Set([
            `${worker} - Production`,
            'Growth Compass Preview 2',
            'Growth Compass Preview 2 - Production'
          ]);
          const cfBase = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          async function cf(path) {
            const response = await fetch(cfBase + path, {
              headers: { Authorization: `Bearer ${cfToken}`, 'Content-Type': 'application/json' }
            });
            const body = await response.json().catch(() => ({}));
            return { status: response.status, ok: response.ok && body.success !== false, result: body.result };
          }

          const reusableResponse = await cf('/access/policies?per_page=1000');
          const reusable = reusableResponse.ok && Array.isArray(reusableResponse.result) ? reusableResponse.result : [];
          const targets = reusable.filter((policy) => expectedPolicyNames.has(policy?.name));
          const target = targets.length === 1 ? targets[0] : null;
          const include = Array.isArray(target?.include) ? target.include : [];
          const hasEmail = include.some((rule) => rule && typeof rule === 'object' && 'email' in rule);
          const hasService = include.some((rule) => rule && typeof rule === 'object' && 'service_token' in rule);
          const hasAnyService = include.some((rule) => rule && typeof rule === 'object' && 'any_valid_service_token' in rule);
          const decision = target?.decision === 'non_identity' ? 'svc' : target?.decision === 'allow' ? 'allow' : target?.decision === 'deny' ? 'deny' : target?.decision ? 'other' : 'none';

          const tokenResponse = await cf('/access/service_tokens?per_page=1000');
          const tokens = tokenResponse.ok && Array.isArray(tokenResponse.result) ? tokenResponse.result : [];
          const tokenMatches = tokenResponse.ok ? tokens.filter((item) => item?.client_id === clientId).length : -1;

          const authResponse = await fetch(`https://${host}/`, {
            redirect: 'manual',
            headers: {
              'CF-Access-Client-Id': clientId,
              'CF-Access-Client-Secret': clientSecret
            }
          });

          const compact = [
            `P${reusableResponse.status}-${reusable.length}-x${targets.length}-${decision}`,
            `e${hasEmail ? 1 : 0}s${hasService ? 1 : 0}a${hasAnyService ? 1 : 0}`,
            `T${tokenResponse.status}-m${tokenMatches}`,
            `H${authResponse.status}`
          ].join('_');
          console.log(compact);

          const statusResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${ghToken}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state: authResponse.status >= 200 && authResponse.status < 300 ? 'success' : 'failure',
              context: `preview2/access-diagnostic/${compact}`.slice(0, 100),
              description: 'Sanitized Preview 2 reusable-policy diagnostic'
            })
          });
          if (!statusResponse.ok) throw new Error(`GitHub status publish failed: ${statusResponse.status}`);
          NODE
