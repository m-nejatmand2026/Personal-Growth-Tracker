name: Deploy Preview

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: growth-compass-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy tested feature head to preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'feature/experience-refinement' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout the exact tested feature commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify preview-only deployment contract
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail

          test "$TESTED_BRANCH" = "feature/experience-refinement"
          test "$TESTED_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"

          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const preview = config.env?.preview;
          const db = preview?.d1_databases?.find((item) => item.binding === 'DB');

          const expectedWorkerBaseName = 'personal-growth-tracker';
          const expectedPreviewWorkerName = 'personal-growth-tracker-preview';
          const expectedPreviewDb = {
            name: 'personal-growth-tracker-preview',
            id: '1937971c-f2f2-4dad-bc65-3d22952584bb'
          };
          const productionDbId = 'a182d8c8-c009-461e-ac7e-04694c1047ab';

          if (config.name !== expectedWorkerBaseName) {
            throw new Error(`Unexpected Worker base name: ${config.name}`);
          }
          if (!preview) throw new Error('Missing explicit preview Wrangler environment.');
          if (preview.name && preview.name !== expectedPreviewWorkerName) {
            throw new Error(`Unexpected preview Worker name: ${preview.name}`);
          }
          if (!db) throw new Error('Missing DB binding in preview environment.');
          if (db.database_name !== expectedPreviewDb.name) {
            throw new Error(`Unexpected preview DB name: ${db.database_name}`);
          }
          if (db.database_id !== expectedPreviewDb.id) {
            throw new Error(`Unexpected preview DB id: ${db.database_id}`);
          }
          if (db.database_id === productionDbId) {
            throw new Error('Preview environment points at production D1. Refusing deployment.');
          }
          NODE

      - name: Verify Cloudflare CI credentials exist
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }

      - name: Refuse automatic database migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.123.0 d1 migrations list DB --remote --env preview 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'No migrations to apply' >/dev/null || {
            echo 'Preview has pending D1 migrations. Automatic Worker deployment is blocked until migrations are reviewed and applied explicitly.'
            exit 1
          }

      - name: Preview dry run
        shell: bash
        run: npx --yes wrangler@4.123.0 deploy --dry-run --env preview --name personal-growth-tracker-preview

      - name: Deploy preview only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --env preview --name personal-growth-tracker-preview

      - name: Smoke test preview
        shell: bash
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          base='https://personal-growth-tracker-preview.m-nejatmand.workers.dev'

          access_id_set=0
          access_secret_set=0
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID" && access_id_set=1 || true
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" && access_secret_set=1 || true

          if [ "$access_id_set" -ne "$access_secret_set" ]; then
            echo 'Cloudflare Access service-token secrets must be configured as a pair.'
            exit 1
          fi

          curl_args=(--fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors)

          if [ "$access_id_set" -eq 1 ]; then
            unauth_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/api/v1/areas")"
            case "$unauth_status" in
              2??)
                echo "Cloudflare Access credentials are configured, but unauthenticated preview API access still returned HTTP $unauth_status. Refusing to treat preview as protected."
                exit 1
                ;;
            esac

            curl_args+=(
              --header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
              --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
            )
          else
            echo 'Cloudflare Access service-token secrets are not configured yet; running transitional unauthenticated preview smoke test.'
          fi

          body="$(curl "${curl_args[@]}" "$base/")"
          printf '%s' "$body" | grep -F 'Growth Compass' >/dev/null
          curl "${curl_args[@]}" "$base/api/v1/areas" >/dev/null
          echo "Preview UI + API smoke tests passed: $base"
