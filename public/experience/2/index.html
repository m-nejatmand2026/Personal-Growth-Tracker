<body>
  <a class="skip-link" href="#experience2Main">Skip to main content</a>
  <div class="app-shell" id="experience2App">
    <aside class="desktop-rail" aria-label="Growth Compass navigation">
      <a class="brand" href="/experience/2/" aria-label="Growth Compass Today"><span class="brand-mark" aria-hidden="true">◆</span><span>Growth Compass</span></a>
      <button type="button" class="rail-add" data-open-add aria-label="Add activity"><span class="nav-icon" aria-hidden="true">＋</span><span>Add</span></button>
      <nav class="rail-links" aria-label="Primary">
        <button type="button" class="nav-item active" data-view="today" aria-current="page"><span class="nav-icon" aria-hidden="true">⌂</span><span>Today</span></button>
        <button type="button" class="nav-item" data-view="plan"><span class="nav-icon" aria-hidden="true">▦</span><span>Plan</span></button>
        <button type="button" class="nav-item" data-view="goals"><span class="nav-icon" aria-hidden="true">◎</span><span>Goals</span></button>
        <button type="button" class="nav-item" data-view="activities"><span class="nav-icon" aria-hidden="true">◇</span><span>Activities</span></button>
        <button type="button" class="nav-item" data-view="progress"><span class="nav-icon" aria-hidden="true">↗</span><span>Progress</span></button>
        <button type="button" class="nav-item" data-view="insights"><span class="nav-icon" aria-hidden="true">✦</span><span>Insights</span></button>
        <button type="button" class="nav-item" data-view="wellness"><span class="nav-icon" aria-hidden="true">◉</span><span>Wellness</span></button>
        <button type="button" class="nav-item" data-view="journal"><span class="nav-icon" aria-hidden="true">≡</span><span>Journal</span></button>
      </nav>
      <div class="rail-footer"><button type="button" class="nav-item" data-view="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span></button><a class="compare-link" href="/">Compare experiences</a></div>
    </aside>
    <main class="main-canvas" id="experience2Main" tabindex="-1">
      <header class="mobile-header"><div><p class="eyebrow">Growth Compass</p><h1 id="viewTitle">Today</h1></div><a class="compare-chip" href="/" aria-label="Compare Preview 2 with Experience 1">P2</a></header>
      <nav class="mobile-secondary" aria-label="More destinations"><button type="button" class="nav-item" data-view="goals"><span class="nav-icon" aria-hidden="true">◎</span><span>Goals</span></button><button type="button" class="nav-item" data-view="activities"><span class="nav-icon" aria-hidden="true">◇</span><span>Activities</span></button><button type="button" class="nav-item" data-view="insights"><span class="nav-icon" aria-hidden="true">✦</span><span>Insights</span></button><button type="button" class="nav-item" data-view="journal"><span class="nav-icon" aria-hidden="true">≡</span><span>Journal</span></button><button type="button" class="nav-item" data-view="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span></button></nav>
      <section id="viewHost" class="view-host" aria-live="polite"></section>
      <div id="installAppHost" aria-live="polite"></div>
    </main>
    <nav class="mobile-dock" aria-label="Primary navigation">
      <button type="button" class="dock-item active" data-view="today" aria-current="page"><span class="dock-icon" aria-hidden="true">⌂</span><span>Today</span></button>
      <button type="button" class="dock-item" data-view="plan"><span class="dock-icon" aria-hidden="true">▦</span><span>Plan</span></button>

      <button type="button" class="dock-item" data-view="progress"><span class="dock-icon" aria-hidden="true">↗</span><span>Progress</span></button>
      <button type="button" class="dock-item" data-view="wellness"><span class="dock-icon" aria-hidden="true">◉</span><span>Wellness</span></button>
    </nav>

  <div id="overlayHost"></div>
  <div id="toastHost" aria-live="polite"></div>
  <script src="/experience/2/js/modal-accessibility.js"></script>
  <script src="/experience/2/js/install-app.js"></script>
  <script type="module" src="/experience/2/js/app.js"></script>
