<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a0f">
  <meta name="description" content="Growth Compass Preview 2 — Ambient Luxury experience.">
  <link rel="manifest" href="/experience/2/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/experience/2/css/foundation.css">
  <link rel="stylesheet" href="/experience/2/css/surfaces.css">
  <link rel="stylesheet" href="/experience/2/css/shell.css">
  <link rel="stylesheet" href="/experience/2/css/today.css">
  <link rel="stylesheet" href="/experience/2/css/plan.css">
  <link rel="stylesheet" href="/experience/2/css/logger.css">
  <link rel="stylesheet" href="/experience/2/css/goals.css">
  <link rel="stylesheet" href="/experience/2/css/progress.css">
  <link rel="stylesheet" href="/experience/2/css/insights.css">
  <link rel="stylesheet" href="/experience/2/css/journal.css">
  <title>Today — Growth Compass</title>
</head>
<body>
  <a class="skip-link" href="#experience2Main">Skip to main content</a>
  <div class="app-shell" id="experience2App">
    <aside class="desktop-rail" aria-label="Growth Compass navigation">
      <a class="brand" href="/experience/2/" aria-label="Growth Compass Today"><span class="brand-mark">GC</span><span>Growth Compass</span></a>
      <button type="button" class="rail-add" data-open-add aria-label="Add activity"><span aria-hidden="true">＋</span> Add activity</button>
      <nav class="rail-links" aria-label="Primary">
        <button type="button" class="nav-item active" data-view="today" aria-current="page">Today</button>
        <button type="button" class="nav-item" data-view="plan">Plan</button>
        <button type="button" class="nav-item" data-view="goals">Goals</button>
        <button type="button" class="nav-item" data-view="progress">Progress</button>
        <button type="button" class="nav-item" data-view="insights">Insights</button>
        <button type="button" class="nav-item" data-view="wellness">Wellness</button>
        <button type="button" class="nav-item" data-view="journal">Journal</button>
      </nav>
      <div class="rail-footer"><button type="button" class="nav-item" data-view="settings">Settings</button><a class="compare-link" href="/">Compare experiences</a></div>
    </aside>
    <main class="main-canvas" id="experience2Main" tabindex="-1">
      <header class="mobile-header"><div><p class="eyebrow">Growth Compass</p><h1 id="viewTitle">Today</h1></div><a class="compare-chip" href="/">Preview 2</a></header>
      <nav class="mobile-secondary" aria-label="More destinations"><button type="button" class="nav-item" data-view="goals">Goals</button><button type="button" class="nav-item" data-view="insights">Insights</button><button type="button" class="nav-item" data-view="journal">Journal</button><button type="button" class="nav-item" data-view="settings">Settings</button></nav>
      <section id="viewHost" class="view-host" aria-live="polite"></section>
    </main>
    <nav class="mobile-dock" aria-label="Primary navigation">
      <button type="button" class="dock-item active" data-view="today" aria-current="page">Today</button>
      <button type="button" class="dock-item" data-view="plan">Plan</button>
      <button type="button" class="dock-add" data-open-add aria-label="Add activity">+</button>
      <button type="button" class="dock-item" data-view="progress">Progress</button>
      <button type="button" class="dock-item" data-view="wellness">Wellness</button>
    </nav>
  </div>
  <div id="overlayHost"></div>
  <div id="toastHost" aria-live="polite"></div>
  <script type="module" src="/experience/2/js/app.js"></script>
</body>
</html>
