<body>
  <svg class="gc-icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="gc-icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m14.9 9.1-1.7 4.1-4.1 1.7 1.7-4.1 4.1-1.7Z"/></symbol>
    <symbol id="gc-icon-today" viewBox="0 0 24 24"><path d="M4.5 10.5 12 4l7.5 6.5v8a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5v-8Z"/><path d="M9.5 20v-5.5h5V20"/></symbol>

    <symbol id="gc-icon-progress" viewBox="0 0 24 24"><path d="M5 18.5V14m5 4.5V10m5 8.5V6m4 12.5H3.5"/></symbol>
    <symbol id="gc-icon-insights" viewBox="0 0 24 24"><path d="M12 3.8 13.5 9l4.7 1.5-4.7 1.5-1.5 5.2-1.5-5.2-4.7-1.5L10.5 9 12 3.8Z"/><path d="m18.5 15 .7 2.3 2.3.7-2.3.7-.7 2.3-.7-2.3-2.3-.7 2.3-.7.7-2.3Z"/></symbol>

  <a class="gc-skip-link" href="#mainContent">Skip to main content</a>
  <main id="app" class="shell os-shell">
    <aside class="app-rail" aria-label="Growth Compass navigation">
      <div class="rail-brand"><span class="brand-mark" aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-compass"></use></svg></span><div><strong>Growth Compass</strong><small>Personal development OS</small></div></div>
      <nav class="rail-nav" aria-label="Primary navigation">
        <button type="button" data-view="today" class="rail-nav-btn active" aria-current="page"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-today"></use></svg></span><b>Today</b></button>
        <button type="button" data-view="plan" class="rail-nav-btn"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-plan"></use></svg></span><b>Plan</b></button>
        <button type="button" data-view="progress" class="rail-nav-btn"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-progress"></use></svg></span><b>Progress</b></button>
        <button type="button" data-view="insights" class="rail-nav-btn"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-insights"></use></svg></span><b>Insights</b></button>
        <button type="button" data-view="wellness-boost" class="rail-nav-btn"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-wellness"></use></svg></span><b>Wellness Boost</b></button>
      </nav>
      <button id="journalRailBtn" class="rail-secondary" type="button"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-journal"></use></svg></span> Journal</button>
      <button class="rail-log-btn" type="button" data-open-logger><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-add"></use></svg></span> Add</button>
      <button id="settingsRailBtn" class="rail-settings" type="button"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-settings"></use></svg></span> Settings</button>
    </aside>
    <div id="mainContent" class="workspace" tabindex="-1">
      <header class="topbar">
        <div class="topbar-title"><div><p class="eyebrow">Growth Compass</p><h1 id="pageTitle">Today</h1></div></div>
        <div class="top-actions">
          <button class="top-log-btn" type="button" data-open-logger aria-label="Add"><svg class="gc-icon" aria-hidden="true"><use href="#gc-icon-add"></use></svg><span>Add</span></button>
          <details id="topMore" class="top-more">
            <summary aria-label="More sections and settings" title="More"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-more"></use></svg></span></summary>
            <div class="top-more-menu" role="group" aria-label="More sections and settings">
              <button id="insightsBtn" type="button"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-insights"></use></svg></span><b>Insights</b></button>
              <button id="journalBtn" type="button"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-journal"></use></svg></span><b>Journal</b></button>
              <button id="settingsBtn" type="button"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-settings"></use></svg></span><b>Settings</b></button>
            </div>
          </details>
        </div>
      </header>
      <section id="todayView" class="view active" aria-labelledby="pageTitle"></section><section id="planView" class="view" aria-labelledby="pageTitle" hidden></section><section id="progressView" class="view" aria-labelledby="pageTitle" hidden></section><section id="insightsView" class="view" aria-labelledby="pageTitle" hidden></section><section id="wellness-boostView" class="view" aria-labelledby="pageTitle" hidden></section><section id="journalView" class="view" aria-labelledby="pageTitle" hidden></section><section id="settingsView" class="view" aria-labelledby="pageTitle" hidden></section>
    </div>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button type="button" data-view="today" class="nav-btn active" aria-current="page"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-today"></use></svg></span>Today</button><button type="button" data-view="plan" class="nav-btn"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-plan"></use></svg></span>Plan</button><button id="quickAddBtn" class="nav-btn nav-add" type="button" data-open-logger aria-label="Add"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-add"></use></svg></span><b>Add</b></button><button type="button" data-view="progress" class="nav-btn"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-progress"></use></svg></span>Progress</button><button type="button" data-view="wellness-boost" class="nav-btn" aria-label="Wellness Boost"><span aria-hidden="true"><svg class="gc-icon"><use href="#gc-icon-wellness"></use></svg></span>Wellness</button>
    </nav>
  </main>
