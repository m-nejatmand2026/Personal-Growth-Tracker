<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="description" content="Personal growth tracker for energy, training, German, guitar and reading." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <title>Growth Compass</title>
</head>
<body>
  <main id="app" class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Growth Compass</p>
        <h1 id="pageTitle">Today</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="Refresh">↻</button>
    </header>

    <section id="todayView" class="view active"></section>
    <section id="weekView" class="view"></section>
    <section id="planView" class="view"></section>
    <section id="historyView" class="view"></section>
    <section id="settingsView" class="view"></section>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="today" class="nav-btn active"><span>●</span>Today</button>
      <button data-view="week" class="nav-btn"><span>▤</span>Week</button>
      <button data-view="plan" class="nav-btn"><span>⌁</span>Plan</button>
      <button data-view="history" class="nav-btn"><span>◷</span>History</button>
      <button data-view="settings" class="nav-btn"><span>⚙</span>Settings</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
