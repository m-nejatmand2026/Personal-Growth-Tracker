<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="description" content="Growth Compass — a modular personal development planning and progress platform." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/plan.css" />
  <link rel="stylesheet" href="/css/experience.css" />
  <title>Growth Compass</title>
</head>
<body>
  <main id="app" class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Growth Compass</p>
        <h1 id="pageTitle">Today</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Open settings" title="Settings">⚙</button>
    </header>

    <section id="todayView" class="view active"></section>
    <section id="planView" class="view"></section>
    <section id="progressView" class="view"></section>
    <section id="insightsView" class="view"></section>
    <section id="settingsView" class="view"></section>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="today" class="nav-btn active"><span>●</span>Today</button>
      <button data-view="plan" class="nav-btn"><span>⌁</span>Plan</button>
      <button id="quickAddBtn" class="nav-btn nav-add" aria-label="Add or log"><span>＋</span><b>Add</b></button>
      <button data-view="progress" class="nav-btn"><span>◷</span>Progress</button>
      <button data-view="insights" class="nav-btn"><span>✦</span>Insights</button>
    </nav>
  </main>

  <div id="quickAddHost"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
