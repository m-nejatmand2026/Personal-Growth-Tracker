<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f6f6d" />
  <meta name="description" content="Growth Compass — a modular personal development planning and progress platform." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Growth Compass" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/css/plan.css" />
  <link rel="stylesheet" href="/css/experience.css" />
  <link rel="stylesheet" href="/css/design-system.css" />
  <link rel="stylesheet" href="/css/navigation-shell.css" />
  <link rel="stylesheet" href="/css/plan-revision.css" />
  <link rel="stylesheet" href="/css/modules/areas.css" />
  <link rel="stylesheet" href="/css/modules/goals.css" />
  <link rel="stylesheet" href="/css/today.css" />
  <link rel="stylesheet" href="/css/modules/wellbeing.css" />
  <link rel="stylesheet" href="/css/modules/wellness-boost.css" />
  <link rel="stylesheet" href="/css/modules/capacity.css" />
  <link rel="stylesheet" href="/css/modules/progress-today.css" />
  <link rel="stylesheet" href="/css/modules/progress.css" />
  <link rel="stylesheet" href="/css/modules/insights.css" />
  <link rel="stylesheet" href="/css/modules/logger.css" />
  <link rel="stylesheet" href="/css/module-sheets.css" />
  <link rel="stylesheet" href="/css/daily-plan.css" />
  <link rel="stylesheet" href="/css/journal.css" />
  <link rel="stylesheet" href="/css/experience-framework.css" />
  <link rel="stylesheet" href="/css/install-app.css" />
  <link rel="stylesheet" href="/css/accessibility-regression.css" />
  <title>Growth Compass</title>
</head>
<body>
  <main id="app" class="shell os-shell">
    <aside class="app-rail" aria-label="Growth Compass navigation">
      <div class="rail-brand"><span class="brand-mark" aria-hidden="true">GC</span><div><strong>Growth Compass</strong><small>Personal development OS</small></div></div>
      <nav class="rail-nav" aria-label="Primary navigation">
        <button type="button" data-view="today" class="rail-nav-btn active" aria-current="page"><span aria-hidden="true">⌂</span><b>Today</b></button>
        <button type="button" data-view="plan" class="rail-nav-btn"><span aria-hidden="true">◎</span><b>Plan</b></button>
        <button type="button" data-view="progress" class="rail-nav-btn"><span aria-hidden="true">↗</span><b>Progress</b></button>
        <button type="button" data-view="insights" class="rail-nav-btn"><span aria-hidden="true">✦</span><b>Insights</b></button>
        <button type="button" data-view="wellness-boost" class="rail-nav-btn"><span aria-hidden="true">☼</span><b>Wellness Boost</b></button>
      </nav>
      <button id="journalRailBtn" class="rail-secondary" type="button"><span aria-hidden="true">✎</span> Journal</button>
      <button class="rail-log-btn" type="button" data-open-logger><span aria-hidden="true">＋</span> Log progress</button>
      <button id="settingsRailBtn" class="rail-settings" type="button"><span aria-hidden="true">⚙</span> Settings</button>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="topbar-title"><span class="mobile-brand-mark" aria-hidden="true">GC</span><div><p class="eyebrow">Growth Compass</p><h1 id="pageTitle">Today</h1></div></div><div class="top-actions"><button id="insightsBtn" class="icon-btn top-section-btn" type="button" aria-label="Open Insights" title="Insights"><span aria-hidden="true">✦</span><b class="top-section-label">Insights</b></button><button id="journalBtn" class="top-journal-btn" type="button" aria-label="Open journal" title="Journal">✎</button><button class="top-log-btn" type="button" data-open-logger aria-label="Log progress">＋ <span>Log</span></button><button id="settingsBtn" class="icon-btn" type="button" aria-label="Open settings" title="Settings">⚙</button></div></header>
      <section id="todayView" class="view active"></section><section id="planView" class="view"></section><section id="progressView" class="view"></section><section id="insightsView" class="view"></section><section id="wellness-boostView" class="view"></section><section id="journalView" class="view"></section><section id="settingsView" class="view"></section>
    </div>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button type="button" data-view="today" class="nav-btn active" aria-current="page"><span aria-hidden="true">⌂</span>Today</button><button type="button" data-view="plan" class="nav-btn"><span aria-hidden="true">◎</span>Plan</button><button id="quickAddBtn" class="nav-btn nav-add" type="button" data-open-logger aria-label="Log progress"><span aria-hidden="true">＋</span><b>Log</b></button><button type="button" data-view="progress" class="nav-btn"><span aria-hidden="true">↗</span>Progress</button><button type="button" data-view="wellness-boost" class="nav-btn" aria-label="Wellness Boost"><span aria-hidden="true">☼</span>Wellness</button>
    </nav>
  </main>
  <div id="loggerHost"></div><div id="dailyPlanHost"></div><div id="journalHost"></div><div id="installAppHost"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/platform/install-app.js"></script>
</body>
</html>
